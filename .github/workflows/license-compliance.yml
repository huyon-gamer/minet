name: License compliance

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies
        run: dotnet restore minet/minet.csproj --locked-mode

      - name: Regenerate license notices
        shell: pwsh
        run: ./scripts/Generate-ThirdPartyNotices.ps1

      - name: Regenerate SBOM
        shell: pwsh
        run: ./scripts/Generate-Sbom.ps1

      - name: Verify generated artifacts
        shell: pwsh
        run: git diff --exit-code -- THIRD-PARTY-NOTICES.md minet/packages.lock.json sbom/minet.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: minet-cyclonedx-sbom
          path: sbom/minet.cdx.json